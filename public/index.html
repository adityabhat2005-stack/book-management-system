<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Book Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Online Book Management System</h1>

    <!-- Status / Error Message Banner -->
    <div id="message-box" class="message hidden"></div>

    <!-- Add / Update Book Form -->
    <form id="book-form">
      <h2 id="form-title">Add New Book</h2>
      <input type="hidden" id="book-id" />
      <div class="form-group">
        <input type="text" id="title" placeholder="Book Title" required />
        <input type="text" id="author" placeholder="Author Name" required />
        <input type="number" id="price" placeholder="Price (₹)" step="0.01" min="0" required />
      </div>
      <div class="form-actions">
        <button type="submit" id="submit-btn">Add Book</button>
        <button type="button" id="cancel-btn" class="hidden">Cancel Edit</button>
      </div>
    </form>

    <!-- Search Book by ID -->
    <div class="search-bar">
      <input type="number" id="search-id" placeholder="Search Book by ID..." min="1" />
      <button type="button" id="search-btn">Find Book</button>
      <button type="button" id="reset-btn">Show All</button>
    </div>

    <!-- Dynamic Book Table -->
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Author</th>
          <th>Price (₹)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="book-list"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
